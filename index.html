function calcTyreDeg() {
  const idx       = document.getElementById('td-track').value;
  const lapStop   = parseFloat(document.getElementById('td-lap').value);
  const remaining = parseFloat(document.getElementById('td-remaining').value);
  const results   = document.getElementById('td-results');
  const kmHint    = document.getElementById('td-km-hint');
  if (!results) return;

  if (idx === '') {
    if (kmHint) kmHint.textContent = '';
    results.innerHTML = '';
    return;
  }

  const t = tracksData.tyreDeg[parseInt(idx)];

  // Show km hint live as user types lap
  if (!isNaN(lapStop) && lapStop > 0 && kmHint) {
    const km = (lapStop * t.lapLen).toFixed(2);
    kmHint.innerHTML = `${lapStop} tours × ${t.lapLen} km = <strong style="color:#3b9ef5">${km} km</strong> parcourus`;
  } else if (kmHint) {
    kmHint.textContent = '';
  }

  if (isNaN(lapStop) || isNaN(remaining) || lapStop <= 0) {
    results.innerHTML = '';
    return;
  }

  const kmDone   = lapStop * t.lapLen;
  const wearUsed = 100 - remaining;

  if (wearUsed <= 0) {
    results.innerHTML = `<div style="color:var(--muted);font-size:.85rem;font-style:italic;">Usure consommée nulle — les pneus sont encore neufs à ce tour.</div>`;
    return;
  }

  const kmPer1pct = kmDone / wearUsed;
  const pctPerKm  = wearUsed / kmDone;

  // Wear color
  const wearCol = remaining <= 20 ? '#e74c3c' : remaining <= 40 ? '#e67e22' : remaining <= 60 ? '#f1c40f' : '#2ecc71';

  results.innerHTML = `
    <!-- RÉSULTATS PRINCIPAUX -->
    <div class="calc-card fadein" style="background:rgba(232,82,42,.04);border-color:rgba(232,82,42,.25);margin-bottom:1rem;">
      <div class="card-title"><span class="tag">Résultats</span> Analyse d'usure — Tour ${lapStop}</div>

      <!-- Récap visuel -->
      <div style="display:flex;align-items:center;gap:.8rem;margin-bottom:1.4rem;padding:.9rem 1.1rem;background:var(--surface2);border-radius:10px;flex-wrap:wrap;">
        <span style="font-family:'Rajdhani',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);">
          ${lapStop} tours × ${t.lapLen} km/tour
        </span>
        <span style="color:var(--border);">=</span>
        <span style="font-family:'Rajdhani',sans-serif;font-size:1.1rem;font-weight:700;color:#3b9ef5;">${kmDone.toFixed(2)} km</span>
        <span style="color:var(--border);">·</span>
        <span style="font-family:'Rajdhani',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:.1em;color:var(--muted);">Usure restante</span>
        <span style="font-family:'Rajdhani',sans-serif;font-size:1.1rem;font-weight:700;color:${wearCol};">${remaining.toFixed(1)}%</span>
        <span style="color:var(--border);">→</span>
        <span style="font-family:'Rajdhani',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:.1em;color:var(--muted);">Consommée</span>
        <span style="font-family:'Rajdhani',sans-serif;font-size:1.1rem;font-weight:700;color:var(--accent2);">${wearUsed.toFixed(1)}%</span>
      </div>

      <!-- 3 métriques -->
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;">

        <div style="text-align:center;padding:1.2rem;background:rgba(59,158,245,.06);border:1px solid rgba(59,158,245,.2);border-radius:12px;">
          <div style="font-family:'Rajdhani',sans-serif;font-size:.62rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#3b9ef5;margin-bottom:.6rem;">Km parcourus</div>
          <div style="font-family:'Rajdhani',sans-serif;font-size:2.4rem;font-weight:700;color:#3b9ef5;line-height:1;">${kmDone.toFixed(2)}</div>
          <div style="font-size:.72rem;color:var(--muted);margin-top:.3rem;">km</div>
        </div>

        <div style="text-align:center;padding:1.2rem;background:rgba(232,82,42,.06);border:1px solid rgba(232,82,42,.2);border-radius:12px;">
          <div style="font-family:'Rajdhani',sans-serif;font-size:.62rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent2);margin-bottom:.6rem;">Km pour 1% d'usure</div>
          <div style="font-family:'Rajdhani',sans-serif;font-size:2.4rem;font-weight:700;color:var(--accent2);line-height:1;">${kmPer1pct.toFixed(3)}</div>
          <div style="font-size:.72rem;color:var(--muted);margin-top:.3rem;">km / %</div>

          <div style="font-family:'Rajdhani',sans-serif;font-size:2.4rem;font-weight:700;color:#e74c3c;line-height:1;">${pctPerKm.toFixed(4)}</div>

          <div class="formula-hint" style="margin-top:.4rem;">${wearUsed.toFixed(1)} ÷ ${kmDone.toFixed(2)}</div>

        <div class="field" style="margin:0;">
          <label>Tours restants à parcourir</label>
          <input type="number" id="td-proj-laps" placeholder="ex : 31"
            min="1" step="1" oninput="calcTyreDegProjection(${pctPerKm.toFixed(6)}, ${t.lapLen})"
            style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:.75rem 1rem;color:var(--text);font-family:'Exo 2',sans-serif;font-size:1.1rem;font-weight:500;outline:none;-moz-appearance:textfield;transition:border-color .2s,box-shadow .2s;"
            onfocus="this.style.borderColor='#3b9ef5';this.style.boxShadow='0 0 0 3px rgba(59,158,245,.12)'"
            onblur="this.style.borderColor='var(--border)';this.style.boxShadow='none'" />
        </div>
        <div class="field" style="margin:0;">
          <label>Usure supplémentaire estimée</label>
          <div class="result-box" id="td-proj-result"><span class="placeholder">—</span></div>
        </div>
      </div>
      <div id="td-proj-detail" style="font-size:.75rem;color:var(--muted);margin-top:.2rem;"></div>
    </div>`;
}

function calcTyreDegProjection(pctPerKm, lapLen) {
  const laps = parseFloat(document.getElementById('td-proj-laps').value);
  const box  = document.getElementById('td-proj-result');
  const detail = document.getElementById('td-proj-detail');
  if (!box) return;
  if (isNaN(laps) || laps <= 0) {
    box.innerHTML = `<span class="placeholder">—</span>`;
    if (detail) detail.textContent = '';
    return;
  }
  const kmProj  = laps * lapLen;
  const wearAdd = kmProj * pctPerKm;
  const {cls}   = wearColor(wearAdd);
  box.innerHTML = `<span class="${cls}">${wearAdd.toFixed(2)} %</span>`;
  if (detail) detail.innerHTML = `${laps} tours × ${lapLen} km = ${kmProj.toFixed(2)} km × ${pctPerKm.toFixed(4)} %/km`;
}

      <div class="calc-card fadein" style="padding:0;overflow:auto;max-height:340px;margin-bottom:1.4rem;">

      </div>

    <!-- ÉTAPE 3 : TÉLÉCHARGEMENT -->
    <div id="ga-download-step" style="display:none;text-align:center;padding:.4rem 0 1rem;">

}

function ga_gt(el) {
  if (!el) return '';
  const clone = el.cloneNode(true);
  clone.querySelectorAll('.screen-reader-text').forEach(e => e.remove());
  return (clone.textContent || clone.innerText || '').replace(/\s+/g, ' ').trim();
}

// ── Main parser (logique inchangée, juste renommée en ga_) ──────────────────
// ── Valeur la plus fréquente d'un tableau (utilisé pour les relais) ──
function ga_mostFrequent(arr) {
  const freq = {};
  arr.forEach(v => freq[v] = (freq[v] || 0) + 1);
  return Object.entries(freq).sort((a, b) => b[1] - a[1])[0]?.[0] || '-';
}

// ── Calcule les relais (stints) à partir des tours et des arrêts aux stands ──
// laps : tableau [tour, chrono, pos, pneus, meteo, temp, hum, events] (celui produit par ga_parseHtmlString)
// pitStops : tableau [stand, raison, pneuEtat, carbPct, carbApr, temps, tour] (le 7e élément = tour de l'arrêt)
function ga_computeStints(laps, pitStops) {
  const lapsNum = laps.map(l => ({
    tour: parseInt(l[0]),
    meteo: l[4],
    temp: parseFloat(l[5]) || 0,
    hum: parseFloat(l[6]) || 0,
    pneus: l[3]
  }));
  const pitTours = (pitStops || []).map(p => p[6]).filter(t => t !== null && t !== undefined);
  const lastTour = lapsNum.length > 0 ? lapsNum[lapsNum.length - 1].tour : 0;

  const stints = [];
  let prev = 0;
  [...pitTours, lastTour].forEach((endTour, idx) => {
    const sl = lapsNum.filter(l => l.tour > prev && l.tour <= endTour);
    const avgTemp = sl.length ? (sl.reduce((s, l) => s + l.temp, 0) / sl.length).toFixed(1) : '-';
    const avgHum  = sl.length ? (sl.reduce((s, l) => s + l.hum, 0) / sl.length).toFixed(1) : '-';
    const meteoMode = sl.length ? ga_mostFrequent(sl.map(l => l.meteo)) : '-';
    const pneuMode   = sl.length ? ga_mostFrequent(sl.map(l => l.pneus).filter(Boolean)) : '-';
    stints.push({ idx: idx + 1, tours: `${prev + 1}–${endTour}`, avgTemp, avgHum, meteo: meteoMode, pneu: pneuMode });
    prev = endTour;
  });
  return stints;
}

// ── Parseur pur : prend le HTML brut d'une page RaceAnalysis.asp et retourne les données extraites ──
// Ne touche à AUCUN élément du DOM de la page (pas de document.getElementById) : réutilisable partout.
// Lève une erreur (throw) en cas de structure introuvable, à catcher par l'appelant.
function ga_parseHtmlString(raw) {
  if (!raw || !raw.trim()) throw new Error("HTML vide.");

  const parser = new DOMParser();
  const doc = parser.parseFromString(raw, 'text/html');

  // ── 1. TITLE ──
  let title = '';
  const h1 = doc.querySelector('h1.block.center');
  if (h1) {
    const h1text = ga_gt(h1);
    const m = h1text.match(/:\s*(.+?)\s*-\s*(Saison\s*\d+)\s*-\s*(Course\s*\d+)/i);
    if (m) title = m[1].trim() + ', ' + m[2].trim().replace('Saison','Saison') + ' - ' + m[3].trim();
    else title = h1text.replace('Analyse de la course:', '').trim();
  }
  if (!title) {
    const titleTag = doc.querySelector('title');
    if (titleTag) {
      const t = ga_gt(titleTag);
      const m = t.match(/Saison\s*(\d+)\s*-\s*Course\s*(\d+)\s*-\s*(.+?)\s*-\s*Grand/i);
      if (m) title = m[3].trim() + ', Saison ' + m[1] + ' - Course ' + m[2];
      else title = t.split(' - ').slice(1,4).join(', ');
    }
  }
  if (!title) {
    // Repli : format des .xls déjà générés par ce site (bouton "Télécharger" de l'outil Analyse de course) —
    // le titre est dans la toute première cellule <b>, seule dans son tableau (colspan="8").
    const firstCell = doc.querySelector('table td[colspan="8"] b, table td b');
    if (firstCell) title = ga_gt(firstCell);
  }

  // ── 2. LAPS TABLE ──
  let lapsTable = null;
  const allTables = doc.querySelectorAll('table');
  for (const t of allTables) {
    const stepEl = t.querySelector('[data-step="3"]');
    if (stepEl) { lapsTable = t; break; }
    const firstTr = t.querySelector('tr');
    if (firstTr) {
      const htext = ga_gt(firstTr);
      if (htext.includes('Tour') && htext.includes('Chrono') && htext.includes('Pneus')) {
        lapsTable = t; break;
      }
    }
  }

  if (!lapsTable) {
    throw new Error("Tableau des tours introuvable. Vérifiez que vous avez bien copié la page RaceAnalysis.asp complète.");
  }

  const allRows = Array.from(lapsTable.querySelectorAll('tr'));
  let headerIdx = 0;
  for (let i = 0; i < allRows.length; i++) {
    const txt = ga_gt(allRows[i]);
    if (txt.includes('Tour') && txt.includes('Chrono')) { headerIdx = i; break; }
  }

  const laps = [];
  for (let i = headerIdx + 1; i < allRows.length; i++) {
    const row = allRows[i];
    const cells = Array.from(row.querySelectorAll('td'));
    if (cells.length < 7) continue;

    const tourCell = cells[0].cloneNode(true);
    tourCell.querySelectorAll('sup').forEach(s => s.remove());
    const tour = ga_gt(tourCell).replace(/[^\d-]/g, '') || ga_gt(tourCell);

    const chrono = ga_gt(cells[1]);
    const pos = ga_gt(cells[2]);
    const pneus = ga_gt(cells[3]);
    const meteo = ga_gt(cells[4]);
    const temp = ga_gt(cells[5]).replace('°', '').replace('°C','').trim();
    const hum = ga_gt(cells[6]).replace('%', '').trim();

    let events = '-';
    if (cells[7]) {
      const evText = ga_gt(cells[7]);
      events = evText || '-';
    }

    if (tour === '' || isNaN(parseInt(tour))) continue;

    laps.push([tour, chrono, pos, pneus, meteo, temp, hum, events]);
  }

  if (laps.length === 0) {
    throw new Error("Aucun tour trouvé dans le tableau. La structure HTML est peut-être différente.");
  }

  // ── 3. RISKS ──
  let risks = null;
  for (const t of allTables) {
    const txt = ga_gt(t);
    if (!txt.includes('Dépassement') && !txt.includes('Depassement')) continue;
    if (!txt.includes('Défense') && !txt.includes('Defense')) continue;

    const trs = Array.from(t.querySelectorAll('tr'));
    for (let i = trs.length - 1; i >= 0; i--) {
      const cells = Array.from(trs[i].querySelectorAll('td'));
      const vals = cells.map(c => ga_gt(c)).filter(v => v && /^\d+$/.test(v.trim()));
      if (vals.length >= 4) {
        const allVals = cells.map(c => ga_gt(c));
        risks = allVals;
        break;
      }
    }
    if (risks) break;
  }

  // ── 4. ENERGY ──
  let energyBefore = '', energyAfter = '';
  for (const t of allTables) {
    const txt = ga_gt(t);
    if (!txt.includes('nergie du pilote')) continue;

    const labels = Array.from(t.querySelectorAll('.barLabel'));
    if (labels.length >= 6) {
      energyBefore = labels[4].textContent.trim();
      energyAfter  = labels[5].textContent.trim();
    } else if (labels.length >= 2) {
      energyBefore = labels[labels.length-2].textContent.trim();
      energyAfter  = labels[labels.length-1].textContent.trim();
    } else {
      // Repli : format généré par ce site — pas de barres, juste "99% > 51%" en texte direct
      const txtAll = ga_gt(t);
      const m = txtAll.match(/(\d+\s*%)\s*>\s*(\d+\s*%)/);
      if (m) { energyBefore = m[1]; energyAfter = m[2]; }
    }
    break;
  }
  const energy = (energyBefore && energyAfter) ? energyBefore + ' > ' + energyAfter : '';

  // ── 5. SETUP ──
  let setup = null;
  for (const t of allTables) {
    const txt = ga_gt(t);
    if (!txt.includes('glage') || !txt.includes('utilis')) continue;
    if (!txt.includes('A.Av') && !txt.includes('Aileron')) continue;

    const trs = Array.from(t.querySelectorAll('tr'));
    for (const tr of trs) {
      const cells = Array.from(tr.querySelectorAll('td'));
      if (cells.length < 2) continue;
      const firstCell = ga_gt(cells[0]).toLowerCase();
      if (firstCell === 'course') {
        setup = {
          aav:   ga_gt(cells[1]),
          aar:   ga_gt(cells[2]),
          mot:   ga_gt(cells[3]),
          fre:   ga_gt(cells[4]),
          bv:    ga_gt(cells[5]),
          susp:  ga_gt(cells[6])
        };
        break;
      }
    }
    if (!setup) {
      // Repli : format généré par ce site — pas de libellé "Course", juste une ligne d'en-têtes
      // (Aileron avant / Aileron arrière / Moteur / Freins / B.V. / Suspension) suivie d'une ligne de 6 valeurs.
      for (let i = 0; i < trs.length; i++) {
        const headCells = Array.from(trs[i].querySelectorAll('td'));
        const headTxt = headCells.map(c => ga_gt(c));
        if (headTxt.length === 6 && headTxt[0].includes('Aileron avant') && headTxt[2].includes('Moteur')) {
          const dataCells = Array.from((trs[i+1] || { querySelectorAll: () => [] }).querySelectorAll('td'));
          if (dataCells.length === 6) {
            setup = {
              aav: ga_gt(dataCells[0]), aar: ga_gt(dataCells[1]), mot: ga_gt(dataCells[2]),
              fre: ga_gt(dataCells[3]), bv:  ga_gt(dataCells[4]), susp: ga_gt(dataCells[5])
            };
          }
          break;
        }
      }
    }
    if (setup) break;
  }

  // ── 6. WEAR ──
  let wearLevel = null, wearStart = null, wearEnd = null;
  for (const t of allTables) {
    const txt = ga_gt(t);
    if (!txt.includes('Niveau des pi') && !txt.includes('niveau des pi')) continue;
    if (!txt.includes('Usure')) continue;

    const trs = Array.from(t.querySelectorAll('tr'));

    function nextValueRow(startIdx) {
      for (let j = startIdx; j < trs.length; j++) {
        const tds = Array.from(trs[j].querySelectorAll('td'));
        if (tds.length < 11) continue;
        const vals = tds.map(c => ga_gt(c).replace('%','').trim());
        const isDataRow = vals.every(v => v === '' || /^\d+$/.test(v));
        if (isDataRow) return vals;
      }
      return null;
    }

    // Extrait les 11 dernières valeurs numériques d'une ligne qui contient à la fois
    // le libellé (1res cellules, souvent colspan) ET les données (format généré par ce site).
    function sameRowValues(rowIdx) {
      const tds = Array.from(trs[rowIdx].querySelectorAll('td'));
      const numeric = tds.map(c => ga_gt(c).replace('%','').trim()).filter(v => v === '' || /^\d+$/.test(v));
      return numeric.length >= 11 ? numeric.slice(-11) : null;
    }

    for (let i = 0; i < trs.length; i++) {
      // Libellé de ligne : peut être un <th>, ou un <td><b> (format généré par ce site)
      const headerCells = Array.from(trs[i].querySelectorAll('th'));
      const rowLabel = headerCells.length > 0
        ? headerCells.map(th => ga_gt(th)).join(' ')
        : ga_gt(trs[i].querySelector('td'));

      if (rowLabel.includes('Niveau des')) {
        wearLevel = headerCells.length > 0 ? nextValueRow(i + 1) : sameRowValues(i);
      } else if (rowLabel.includes('part') && rowLabel.includes('sure')) {
        wearStart = headerCells.length > 0 ? nextValueRow(i + 1) : sameRowValues(i);
        if (wearStart) wearStart = wearStart.map(v => v.replace('%','').trim());
      } else if ((rowLabel.includes('arriv') || rowLabel.includes('Arriv')) && rowLabel.includes('sure')) {
        wearEnd = headerCells.length > 0 ? nextValueRow(i + 1) : sameRowValues(i);
        if (wearEnd) wearEnd = wearEnd.map(v => v.replace('%','').trim());
      }
    }
    if (wearLevel || wearStart) break;
  }

  // ── 7. FUEL START ──
  let fuelStart = '';
  const bodyText = doc.body ? doc.body.innerHTML : raw;
  const fuelMatch = bodyText.match(/Carburant au d[ée]part[^<:]*:\s*<[^>]*>?\s*(\d+)\s*&?nbsp?;?litres/i)
                 || bodyText.match(/Carburant au d[ée]part[^<:]*:\s*(\d+)\s*(?:&nbsp;)?litres/i);
  if (fuelMatch) fuelStart = fuelMatch[1];
  if (!fuelStart) {
    for (const t of allTables) {
      const txt = ga_gt(t);
      if (txt.includes('Carburant au d')) {
        const trs = Array.from(t.querySelectorAll('tr'));
        for (const tr of trs) {
          const trtxt = ga_gt(tr);
          if (trtxt.includes('Carburant au d')) {
            const cells = Array.from(tr.querySelectorAll('td'));
            if (cells.length >= 2) { fuelStart = ga_gt(cells[1]).replace('litres','').trim(); break; }
          }
        }
        if (fuelStart) break;
      }
    }
  }

  // ── 8. PIT STOPS (avec extraction du numéro de tour, nécessaire pour les relais) ──
  let pitStops = [];
  for (const t of allTables) {
    const txt = ga_gt(t);
    if (!txt.includes('Etat des pneus') && !txt.includes('État des pneus')) continue;
    if (!txt.includes('Carburant')) continue;
    if (!txt.includes('Arr')) continue;

    const trs = Array.from(t.querySelectorAll('tr'));
    for (let i = 1; i < trs.length; i++) {
      const cells = Array.from(trs[i].querySelectorAll('td'));
      if (cells.length < 4) continue;
      const firstTxt = ga_gt(cells[0]);
      if (!firstTxt.match(/Arr[eê]t\s*\d/i)) continue;

      const stand   = firstTxt.replace(/\s+/g,' ').replace('&nbsp;',' ').trim();
      const raison  = ga_gt(cells[1]);
      const pneuEtat= ga_gt(cells[2]).replace('%','').trim();
      const carbPct = ga_gt(cells[3]).replace('%','').trim();
      const carbApr = ga_gt(cells[4]);
      const temps   = ga_gt(cells[5]);
      const tourMatch = stand.match(/Tour\s*(\d+)/i);
      const tour = tourMatch ? parseInt(tourMatch[1]) : null;

      pitStops.push([stand, raison, pneuEtat, carbPct, carbApr, temps, tour]);
    }
    if (pitStops.length > 0) break;
  }

  // ── 9. FINAL STATE ──
  let finalTires = '', finalFuel = '';
  if (doc.body) {
    const paras = Array.from(doc.body.querySelectorAll('p'));
    for (const p of paras) {
      const txt = ga_gt(p);
      if (txt.includes('pneus') && txt.includes('fin de la course')) {
        const m = txt.match(/(\d+)\s*%/);
        if (m) finalTires = m[1];
      }
      if (txt.includes('Carburant') && txt.includes('fin de course')) {
        const m = txt.match(/(\d+)\s*litres/);
        if (m) finalFuel = m[1];
      }
    }
  }
  // Repli : mêmes infos, mais dans un <table> (format généré par ce site) plutôt que dans des <p>
  if (!finalTires || !finalFuel) {
    for (const t of allTables) {
      const trs = Array.from(t.querySelectorAll('tr'));
      for (const tr of trs) {
        const cells = Array.from(tr.querySelectorAll('td'));
        if (cells.length < 2) continue;
        const label = ga_gt(cells[0]);
        if (!finalTires && label.includes('pneus') && label.includes('fin de la course')) {
          const m = ga_gt(cells[1]).match(/(\d+)/);
          if (m) finalTires = m[1];
        }
        if (!finalFuel && label.includes('Carburant') && label.includes('fin de course')) {
          const m = ga_gt(cells[1]).match(/(\d+)/);
          if (m) finalFuel = m[1];
        }
      }
    }
  }
  if (!finalTires) {
    const m = raw.match(/pneus[^<]*fin de la course[^<]*<[^>]*>\s*(\d+)/i)
            || raw.match(/pneus.*?fin.*?(\d+)\s*%/i);
    if (m) finalTires = m[1];
  }
  if (!finalFuel) {
    const m = raw.match(/Carburant restant en fin de course[^<]*<[^>]*>\s*(\d+)/i)
            || raw.match(/Carburant restant en fin.*?(\d+)\s*litres/i);
    if (m) finalFuel = m[1];
  }

  // ── 10. RELAIS (STINTS) ──
  const stints = ga_computeStints(laps, pitStops);

  return { title, laps, risks, energy, setup, wearLevel, wearStart, wearEnd, fuelStart, pitStops, finalTires, finalFuel, stints };
}

// ── Wrapper UI : lit le textarea de l'outil "Analyse de course", appelle le parseur pur, met à jour le DOM ──
function ga_parse() {
  const raw = document.getElementById('ga-html-input').value.trim();
  if (!raw) { ga_showStatus('err', "Collez d'abord le HTML de la page d'analyse."); return; }

  try {
    ga_raceData = ga_parseHtmlString(raw);
    ga_renderPreview();
    ga_showStatus('ok', `✓ ${ga_raceData.laps.length} tours extraits — "${ga_raceData.title}"`);
    document.getElementById('ga-preview-step').style.display = '';
    document.getElementById('ga-download-step').style.display = '';
  } catch(e) {
    ga_showStatus('err', 'Erreur de parsing : ' + e.message);
    console.error(e);
  }
}

// ── Preview ──
function ga_renderPreview() {
  const { laps, pitStops, title } = ga_raceData;
  const errors = laps.filter(r => r[7] && r[7].toLowerCase().includes('erreur')).length;
  const techs  = laps.filter(r => r[7] && r[7].toLowerCase().includes('technique')).length;

  document.getElementById('ga-stats-bar').innerHTML = `
    <div class="calc-card" style="text-align:center;"><div class="card-title" style="justify-content:center;">Course</div><div style="font-family:'Rajdhani',sans-serif;font-size:.95rem;font-weight:700;color:var(--text);line-height:1.3;">${title||'—'}</div></div>
    <div class="calc-card" style="text-align:center;"><div class="card-title" style="justify-content:center;">Tours</div><div style="font-family:'Rajdhani',sans-serif;font-size:1.8rem;font-weight:700;color:#3b9ef5;">${laps.length}</div></div>
    <div class="calc-card" style="text-align:center;"><div class="card-title" style="justify-content:center;">Arrêts stands</div><div style="font-family:'Rajdhani',sans-serif;font-size:1.8rem;font-weight:700;color:var(--accent2);">${pitStops.length}</div></div>
    <div class="calc-card" style="text-align:center;"><div class="card-title" style="justify-content:center;">Erreurs</div><div style="font-family:'Rajdhani',sans-serif;font-size:1.8rem;font-weight:700;color:${errors>0?'#e74c3c':'#2ecc71'};">${errors}</div></div>
  `;

  const headers = ['Tour','Chrono','Pos.','Pneus','Météo','Temp. (°)','Hum. (%)','Événements'];
  let html = '<thead><tr>' + headers.map(h=>`<th style="background:rgba(59,158,245,.1);color:#3b9ef5;padding:.5rem .8rem;text-align:center;font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.7rem;position:sticky;top:0;">${h}</th>`).join('') + '</tr></thead><tbody>';
  for (const lap of laps) {
    const ev = (lap[7]||'').toLowerCase();
    let bg = 'transparent';
    if (ev.includes('stands')) bg = 'rgba(241,196,15,.06)';
    else if (ev.includes('erreur') || ev.includes('technique')) bg = 'rgba(231,76,60,.06)';
    html += `<tr style="background:${bg};">` + lap.map(c=>`<td style="padding:.4rem .8rem;text-align:center;border-bottom:1px solid var(--border);color:var(--text);white-space:nowrap;">${c}</td>`).join('') + '</tr>';
  }
  html += '</tbody>';
  document.getElementById('ga-preview-table').innerHTML = html;
}

// ── XLS Generator (logique inchangée) ──
function ga_esc(s) {
  if (!s || s==='-') return s||'-';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function ga_generateXlsHtml() {

      o += '\t\t\t\t<td align="center">-</td>\r\n';
      o += '\t\t\t</tr>\r\n';
    } else {
      o += '\r\n\t\t<tr>\r\n\t\t\t<td align="center">' + ga_esc(lap[0]) + '</td>\r\n';
      o += '<td align="center">' + ga_esc(lap[1]) + '</td>';

    }
  }
  o += '        </table>\r\n        <br><br>\r\n';

  if (d.risks) {
    const rHdrs = ['Dépassement','Défense','Sec et dégagé','Mouillé','Disfonctionnement',''];
    o += '        <table>\r\n\t        <tr ><td colspan="6" align="left"><b>Risques utilisés:</b></td></tr>\r\n\t        <tr >\r\n';
    for (const h of rHdrs) o += '\t\t        <td align="center"><b>' + ga_esc(h) + '</b></td>\r\n';
    o += '\t        </tr>\r\n\t        <tr>\r\n';

    o += '\t        </tr>\r\n        </table><br>\r\n';

  if (d.energy) {
    o += '        \r\n        <table>\r\n\t\t\t<tr><td><b>Énergie du pilote</b></td></tr>\r\n\t\t\t<tr>\r\n\t\t\t\t<td>' + ga_esc(d.energy) + '</td>\r\n\t\t\t</tr>\r\n\t\t</table><br>\r\n\t\t\r\n';
  }

  if (d.setup) {
    const sHdrs = ['Aileron avant','Aileron arrière','Moteur','Freins','B.V.','Suspension'];
    const sVals = [d.setup.aav, d.setup.aar, d.setup.mot, d.setup.fre, d.setup.bv, d.setup.susp];
    o += '\t    <table>\r\n\t\t    <tr ><td colspan="6" align="left"><b>Réglage utilisé:</b></td></tr>\r\n\t\t    <tr >\r\n';

  if (d.wearStart || d.wearEnd) {
    o += '\t    <table>\r\n\t\t    <tr>\r\n\t\t        <td colspan="2" align="center"></td>\r\n';
    for (const c of wCols) o += '\t\t\t    <td align="center"><b>' + c + '</b></td>\r\n';
    o += '\t\t    </tr>\r\n';
    if (d.wearLevel) {
      o += '\t\t    <tr>\r\n\t\t        <td colspan="2" align="left"><b>Niveau des pièces de la voiture:</b></td>\r\n';
      for (let i = 0; i < wCols.length; i++) o += '\t\t\t    <td align="center">' + ga_esc((d.wearLevel[i]||'')) + '</td>';
      o += '\r\n\t\t    </tr>\r\n';
    }
    if (d.wearStart) {
      o += '\t\t    <tr>\r\n\t\t        <td colspan="2" align="left"><b>Usure des pièces de la voiture (au départ) (%):</b></td>\r\n';
      for (let i = 0; i < wCols.length; i++) o += '\t\t\t    <td align="center">' + ga_esc((d.wearStart[i]||'')) + '</td>';
      o += '\r\n\t\t    </tr>\r\n';
    }
    if (d.wearEnd) {
      o += '\t\t    <tr>\r\n\t\t        <td colspan="2" align="left" nowrap><b>Usure des pièces de la voiture (à l\'arrivée) (%):</b></td>\r\n';
      for (let i = 0; i < wCols.length; i++) o += '\t\t\t    <td align="center">' + ga_esc((d.wearEnd[i]||'')) + '</td>';
      o += '\r\n\t\t    </tr>\r\n';
    }
    o += '\t    </table><br>\r\n';
  }

  if (d.fuelStart) {
    o += '        <table>\r\n\t        <tr>\r\n\t\t        <td><b>Carburant au départ (litres):</b></td>\r\n\t\t        <td align="left">' + ga_esc(d.fuelStart) + '</td>\r\n\t        </tr>\r\n        </table><br>\r\n\r\n';
  }

  if (d.pitStops && d.pitStops.length > 0) {
    const pHdrs = ['Stands','Raison arrêt aux stands','Etat des pneus (%)','Carburant restant (%)','Carburant après arrêt (litres)','Temps arrêt aux stands (sec.)'];
    o += '    <table>\r\n\t\t<tr>\r\n';
    for (const h of pHdrs) o += '\t\t    <td align="center"><b>' + ga_esc(h) + '</b></td>\r\n';
    o += '\t\t</tr>\r\n\r\n';
    for (const pit of d.pitStops) {
      o += '\t\t  <tr>\r\n';
      for (let i = 0; i < pHdrs.length; i++) o += '\t\t        <td align="center">' + ga_esc(pit[i]||'') + '</td>\r\n';
      o += '\t        </tr>\r\n\r\n';
    }
    o += '\t\t</table>\r\n\r\n';
  }

  if (d.finalTires || d.finalFuel) {
    o += '        <br>\r\n        <table>\r\n';
    if (d.finalTires) o += '\t        <tr>\r\n\t\t        <td nowrap><b>Etat des pneus à la fin de la course (%):</b></td>\r\n\t\t        <td align="left">' + ga_esc(d.finalTires) + '</td>\r\n\t        </tr>\r\n\t        <tr><td colspan="2"></td></tr>\r\n';
    if (d.finalFuel)  o += '\t        <tr>\r\n\t\t        <td nowrap><b>Carburant restant en fin de course (litres):</b></td>\r\n\t\t        <td align="left">' + ga_esc(d.finalFuel) + '</td>\r\n\t        </tr>\r\n';
    o += '        </table><br>\r\n        ';
  }

  return o;
}

function ga_downloadXls() {
  if (!ga_raceData) { ga_showStatus('err', 'Aucune donnée.'); return; }
  const content = ga_generateXlsHtml();
  const blob = new Blob(['\uFEFF' + content], { type: 'application/vnd.ms-excel;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  let fname = 'analyse_course.xls';
  if (ga_raceData.title) fname = ga_raceData.title.replace(/[^a-zA-Z0-9_\-. ]/g,'_').replace(/\s+/g,'_') + '.xls';
  a.href = url; a.download = fname; a.click();
  URL.revokeObjectURL(url);
}

/* ─── STOCKAGE IndexedDB (quota bien plus large que localStorage) ─── */
function marche_idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('ProtobizMarcheDB', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('cache');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function marche_idbGet(key) {
  const db = await marche_idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('cache', 'readonly');
    const req = tx.objectStore('cache').get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function marche_idbSet(key, value) {
  const db = await marche_idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('cache', 'readwrite');
    tx.objectStore('cache').put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
  
async function initGproMarche() {
  try {
    const cached = await marche_idbGet(MARCHE_CACHE_KEY);
    if (cached && (Date.now() - cached.fetchedAt) < MARCHE_CACHE_MS) {
      gproMarche.drivers = cached.drivers;
      gproMarche.lastUpdated = cached.lastUpdated;
      marche_render();
      return;
    }
  } catch(e) {}
  await marche_fetch();
  marche_render();
}

async function marche_fetch() {
  gproMarche.loading = true; gproMarche.error = null; marche_render();
  try {
    const resp = await fetch('https://gpro.net/GetMarketFile.asp?market=drivers&type=json');
    if (!resp.ok) throw new Error('Erreur réseau ' + resp.status);
    const buf = await resp.arrayBuffer();
    const stream = new Response(buf).body.pipeThrough(new DecompressionStream('gzip'));
    const text = await new Response(stream).text();
    const data = JSON.parse(text);
    gproMarche.drivers = data.drivers || [];
    gproMarche.lastUpdated = data['Last updated'] || null;
    try {
      await marche_idbSet(MARCHE_CACHE_KEY, {
        fetchedAt: Date.now(), drivers: gproMarche.drivers, lastUpdated: gproMarche.lastUpdated
      });
    } catch(cacheErr) {
      console.warn('Cache IndexedDB impossible.', cacheErr);
    }
  } catch(e) {
    gproMarche.error = e.message;
  } finally {
    gproMarche.loading = false;
  }
}

function marche_setFilter(key, val) {
  if (val === '' || val === null || isNaN(val)) val = null;
  gproMarche.filters[key] = val;
  gproMarche.page = 1;
  marche_render();
}
function marche_setSort(key) {
  if (gproMarche.sortKey === key) gproMarche.sortDir = gproMarche.sortDir === 'asc' ? 'desc' : 'asc';
  else { gproMarche.sortKey = key; gproMarche.sortDir = 'desc'; }
  marche_render();
}
function marche_gotoPage(p) { gproMarche.page = p; marche_render(); }

function marche_getFiltered() {
  const f = gproMarche.filters;
  let list = gproMarche.drivers.filter(d => {
    if (d.OA < f.oaMin || d.OA > f.oaMax) return false;
    if (f.name && !d.NAME.toLowerCase().includes(f.name.toLowerCase())) return false;
    for (const s of MARCHE_SKILLS) {
  const mn = f[s.key + 'min'], mx = f[s.key + 'max'];
  if (mn !== null && d[s.key] < mn) return false;
  if (mx !== null && d[s.key] > mx) return false;
}
    if (d.WEI > f.weiMax) return false;
    if (d.AGE > f.ageMax) return false;
    if (d.SAL < f.salMin) return false;
    if (f.salMax !== null && d.SAL > f.salMax) return false;
    if (d.OFF > f.offMax) return false;
    if (f.noOffers && d.OFF >= 1) return false;
    return true;
  });
  list.sort((a,b) => (a[gproMarche.sortKey]-b[gproMarche.sortKey]) * (gproMarche.sortDir==='asc'?1:-1));
  return list;
}

      <button class="btn-reset-setup" ${gproMarche.page<=1?'disabled':''} onclick="marche_gotoPage(${gproMarche.page-1})">← Précédent</button>
      <span style="font-size:.82rem;color:var(--muted);">Page ${gproMarche.page} / ${pageCount}</span>
      <button class="btn-reset-setup" ${gproMarche.page>=pageCount?'disabled':''} onclick="marche_gotoPage(${gproMarche.page+1})">Suivant →</button>
    </div>
  `;
}

/* ══════════════════════════════════════
   OUTIL GPRO : DATAS (recherche circuit — étape 3)
══════════════════════════════════════ */

let gproDatas = { query: '', selectedIdx: null };

function gproDatas_slugify(str) {
  return (str || '')
    .toString()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // enlève les accents
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/(^-|-$)/g, '');
}
function gproDatas_trackId(t) {
  return gproDatas_slugify(t.pays) + '-' + gproDatas_slugify(t.name);
}
  
function toolGproDatasHTML() {
  return `
  <div class="tool-panel" style="max-width:95%;">
    <div class="tool-header fadein">
      <h2><span class="accent-bar" style="background:linear-gradient(180deg,#2980b9,#3b9ef5);"></span> Datas</h2>
      <p>Recherchez un Grand Prix pour retrouver les caractéristiques du circuit et les analyses enregistrées.</p>
    </div>

    <div class="calc-card fadein fadein-d1" style="border-color:rgba(59,158,245,.25);margin-bottom:1.4rem;position:relative;">
      <div class="card-title" style="color:#3b9ef5;"><span class="tag" style="background:rgba(59,158,245,.15);color:#3b9ef5;">🔍</span> Rechercher un Grand Prix</div>
      <div class="field" style="margin:0;position:relative;">
        <input type="text" id="gd-search" placeholder="Tapez le nom du circuit ou du pays…" autocomplete="off"
          oninput="gproDatas_onSearch(this.value)"
          onfocus="gproDatas_onSearch(this.value)"
          onblur="setTimeout(()=>{const d=document.getElementById('gd-dropdown'); if(d) d.style.display='none';},150)"
          style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:.75rem 1rem;color:var(--text);font-family:'Exo 2',sans-serif;font-size:1rem;outline:none;transition:border-color .2s,box-shadow .2s;" />
        <div id="gd-dropdown" style="display:none;position:absolute;left:0;right:0;top:100%;margin-top:.4rem;background:var(--surface2);border:1px solid var(--border);border-radius:10px;max-height:280px;overflow-y:auto;z-index:20;box-shadow:0 12px 30px rgba(0,0,0,.4);"></div>
      </div>
      <div id="gd-search-status" style="font-size:.78rem;color:var(--muted);margin-top:.5rem;"></div>
    </div>

    <div id="gd-circuit-info" style="display:none;margin-bottom:1.4rem;"></div>

    <div id="gd-upload-zone" style="display:none;margin-bottom:1.4rem;"></div>

    <div id="gd-analyses-zone"></div>
  </div>`;
}

function initGproDatas() {
  gproDatas = { query: '', selectedIdx: null };
  const status = document.getElementById('gd-search-status');
  if (status) status.textContent = 'Chargement des circuits…';
  waitForTracksData(() => {
    if (!status) return;
    if (tracksData.error) {
      status.textContent = '⚠️ Erreur : ' + tracksData.error;
      status.style.color = '#e74c3c';
      return;
    }
    status.style.color = 'var(--muted)';
    status.textContent = `${tracksData.tyreDeg.length} circuits disponibles`;
  });
}

function gproDatas_onSearch(val) {
  const dropdown = document.getElementById('gd-dropdown');
  if (!dropdown || !tracksData.loaded) return;
  gproDatas.query = val.trim().toLowerCase();

  const list = tracksData.tyreDeg
    .map((t, i) => ({ t, i }))
    .filter(({ t }) => !gproDatas.query
      || (t.name || '').toLowerCase().includes(gproDatas.query)
      || (t.pays || '').toLowerCase().includes(gproDatas.query))
    .slice(0, 30);

  if (list.length === 0) {
    dropdown.innerHTML = `<div style="padding:.8rem 1rem;color:var(--muted);font-size:.85rem;font-style:italic;">Aucun circuit trouvé</div>`;
    dropdown.style.display = 'block';
    return;
  }

  dropdown.innerHTML = list.map(({ t, i }) => `
    <div onclick="gproDatas_selectCircuit(${i})"
         style="padding:.7rem 1rem;cursor:pointer;display:flex;align-items:center;gap:.7rem;border-bottom:1px solid var(--border);transition:background .15s;"
         onmouseover="this.style.background='rgba(59,158,245,.08)'" onmouseout="this.style.background='transparent'">
      <span style="font-size:1.2rem;">${t.flag || '🏁'}</span>
      <div>
        <div style="font-family:'Rajdhani',sans-serif;font-weight:700;font-size:.9rem;color:var(--text);">${t.name}</div>
        <div style="font-size:.72rem;color:var(--muted);">${t.pays || ''}</div>
      </div>
    </div>`).join('');
  dropdown.style.display = 'block';
}

function gproDatas_selectCircuit(idx) {
  gproDatas.selectedIdx = idx;
  const t = tracksData.tyreDeg[idx];
  const dropdown = document.getElementById('gd-dropdown');
  const search = document.getElementById('gd-search');
  if (dropdown) dropdown.style.display = 'none';
  if (search) search.value = `${t.flag || ''} ${t.name}`.trim();

  const info = document.getElementById('gd-circuit-info');
  if (!info) return;
  info.style.display = 'block';
  info.innerHTML = gproDatas_buildCircuitInfoHTML(t);

  // Étape 4 : ici viendra le chargement/upload des analyses liées à ce circuit
  const upZone = document.getElementById('gd-upload-zone');
  if (upZone) {
    upZone.style.display = 'block';
    upZone.innerHTML = gproDatas_buildUploadHTML();
  }
  gproDatas_loadAnalyses(trackId);
}

async function gproDatas_loadAnalyses(trackId) {
  const zone = document.getElementById('gd-analyses-zone');
  if (!zone) return;
  zone.innerHTML = `<div class="no-data-msg">⏳ Chargement des analyses…</div>`;
  try {
    const resp = await fetch(`/datas/${trackId}`);
    if (!resp.ok) throw new Error('Erreur serveur ' + resp.status);
    const analyses = await resp.json();
    gproDatas.analyses = analyses; // stocké pour l'étape 5
    zone.innerHTML = analyses.length
      ? `<div class="no-data-msg" style="font-style:normal;color:var(--text);">📊 ${analyses.length} analyse${analyses.length>1?'s':''} enregistrée${analyses.length>1?'s':''} pour ce circuit.</div>`
      : `<div class="no-data-msg">Aucune analyse enregistrée pour ce circuit.</div>`;
  } catch (e) {
    zone.innerHTML = `<div class="no-data-msg" style="color:var(--red);font-style:normal;">⚠️ Impossible de charger les analyses : ${e.message}</div>`;
  }
}

function gproDatas_buildCircuitInfoHTML(t) {
  const stats = [
    { label: '📏 Longueur course', val: t.dist + ' km', plain: true },
    { label: '🔄 Tours',           val: t.laps,          plain: true },
    { label: '📐 Longueur tour',   val: t.lapLen + ' km',plain: true },
    { label: '⚡ Vitesse moy.',    val: t.vitesse,        plain: true },
    { label: '🔩 PIT',             val: t.pit,            plain: true },
    { label: '💪 Puissance',       val: t.puissance,     plain: true },
    { label: '🎮 Maniabilité',     val: t.maniab,        plain: true },
    { label: '🚀 Accélération',    val: t.accel,         plain: true },
    { label: '⬇️ Force d\'appui', val: t.appui,         type: 'appui' },
    { label: '🏁 Dépassement',     val: t.depasse,       type: 'depasse' },
    { label: '🔧 Suspension',      val: t.suspension,    type: 'suspension' },
    { label: '⛽ Carburant',       val: t.carburant,     type: 'carburant' },
    { label: '🔴 Usure pneus',     val: t.usurePneus,   type: 'usurePneus' },
    { label: '🟢 Grip',            val: t.grip,          type: 'grip' },
  ];
  return `
    <div class="calc-card" style="border-color:rgba(59,158,245,.35);background:rgba(59,158,245,.04);padding:1.4rem 1.6rem;">
      <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.2rem;flex-wrap:wrap;">
        <span style="font-size:1.8rem;">${t.flag || ''}</span>
        <div>
          <div style="font-family:'Rajdhani',sans-serif;font-size:1.4rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text);">${t.name}</div>
          <div style="font-size:.78rem;color:var(--muted);letter-spacing:.06em;">${t.pays || ''}</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem 1.2rem;">
        ${stats.map(s => `
        <div>
          <div style="font-family:'Rajdhani',sans-serif;font-size:.62rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#3b9ef5;margin-bottom:.35rem;">${s.label}</div>
          <div>${s.type ? tdColorBadge(s.val, s.type) : `<span style="font-family:'Rajdhani',sans-serif;font-size:1rem;font-weight:700;color:var(--text);">${s.val}</span>`}</div>
        </div>`).join('')}
      </div>
    </div>`;
}

  function gproDatas_buildUploadHTML() {
  return `
    <div class="calc-card" style="border-color:rgba(232,82,42,.25);">
      <div class="card-title"><span class="tag">📤</span> Ajouter une analyse (.xls) pour ce circuit</div>
      <div id="gd-drop" onclick="document.getElementById('gd-file-input').click()"
        ondragover="event.preventDefault();this.style.borderColor='var(--accent)'"
        ondragleave="this.style.borderColor='var(--border)'"
        ondrop="gproDatas_onDrop(event)"
        style="border:2px dashed var(--border);border-radius:12px;padding:2rem;text-align:center;cursor:pointer;color:var(--muted);font-size:.85rem;transition:border-color .2s;">
        📂 Cliquez ou glissez-déposez le fichier .xls de l'analyse ici
      </div>
      <input type="file" id="gd-file-input" accept=".xls,.html,.htm" style="display:none;" onchange="gproDatas_onFileSelected(this.files[0])" />
      <div id="gd-upload-status" style="margin-top:1rem;font-size:.85rem;display:none;padding:.7rem 1rem;border-radius:8px;font-weight:600;"></div>
    </div>`;
}

function gproDatas_onDrop(e) {
  e.preventDefault();
  document.getElementById('gd-drop').style.borderColor = 'var(--border)';
  const file = e.dataTransfer.files[0];
  if (file) gproDatas_onFileSelected(file);
}

function gproDatas_showUploadStatus(type, msg) {
  const el = document.getElementById('gd-upload-status');
  if (!el) return;
  el.style.display = 'block';
  if (type === 'ok') {
    el.style.background = 'rgba(46,204,113,.1)'; el.style.border = '1px solid rgba(46,204,113,.3)'; el.style.color = '#2ecc71';
  } else if (type === 'loading') {
    el.style.background = 'rgba(59,158,245,.1)'; el.style.border = '1px solid rgba(59,158,245,.3)'; el.style.color = '#3b9ef5';
  } else {
    el.style.background = 'rgba(231,76,60,.1)'; el.style.border = '1px solid rgba(231,76,60,.3)'; el.style.color = '#e74c3c';
  }
  el.textContent = msg;
}

function gproDatas_onFileSelected(file) {
  if (!file) return;
  if (gproDatas.selectedIdx === null) {
    gproDatas_showUploadStatus('err', 'Sélectionnez d\'abord un circuit.');
    return;
  }
  gproDatas_showUploadStatus('loading', '⏳ Lecture du fichier…');

  const reader = new FileReader();
  reader.onload = () => gproDatas_processFileContent(reader.result);
  reader.onerror = () => gproDatas_showUploadStatus('err', 'Impossible de lire le fichier.');
  reader.readAsText(file, 'utf-8');
}

async function gproDatas_processFileContent(rawHtml) {
  let parsed;
  try {
    parsed = ga_parseHtmlString(rawHtml); // réutilise le parseur existant tel quel
  } catch (e) {
    gproDatas_showUploadStatus('err', 'Erreur de parsing : ' + e.message);
    return;
  }

  const t = tracksData.tyreDeg[gproDatas.selectedIdx];
  const trackId = gproDatas_trackId(t);

  gproDatas_showUploadStatus('loading', `✓ ${parsed.laps.length} tours extraits — sauvegarde en cours…`);

  try {
    const resp = await fetch(`/datas/${trackId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        circuitName: t.name,
        pays: t.pays,
        data: parsed
      })
    });

    if (!resp.ok) throw new Error('Le serveur a répondu ' + resp.status);
    const saved = await resp.json(); // contient id + savedAt générés par le Worker

    gproDatas_showUploadStatus('ok', `✅ Analyse enregistrée pour ${t.name} (${parsed.laps.length} tours).`);
    gproDatas_loadAnalyses(trackId);
  } catch (e) {
    gproDatas_showUploadStatus('err', '⚠️ Échec de la sauvegarde : ' + e.message);
  }
}

  
</script>
